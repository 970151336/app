<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="全球电视直播">
    <meta name="theme-color" content="#0a0b10">
    <title>全球电视直播</title>
    <style type="text/css">
        :root {
            --safe-area-inset-top: env(safe-area-inset-top);
            --safe-area-inset-bottom: env(safe-area-inset-bottom);
            --safe-area-inset-left: env(safe-area-inset-left);
            --safe-area-inset-right: env(safe-area-inset-right);
            --primary: #ff2d55;
            --gold: #ffd24a;
            --text-sub: #969cab;
            --nav-bg: rgba(10, 11, 16, 0.92);
            --border: rgba(255, 255, 255, 0.08);
            --bg: #0a0b10;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; max-width: 100%; }
        body { min-height: 100vh; padding: 0; overflow: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; height: 100vh; width: 100vw; background: var(--bg); }
        .content { width: 100%; height: 100vh; position: relative; overflow: hidden; }
        .content iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; overflow: hidden; z-index: 1; -webkit-overflow-scrolling: touch; }
        .page-iframe { display: none; }
        .page-iframe.active { display: block; }
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(10,11,16,.6); display: flex; justify-content: center; align-items: center; z-index: 50; }
        .loader { width: 46px; height: 46px; border: 4px solid rgba(255,255,255,.14); border-bottom-color: var(--primary); border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: constant(safe-area-inset-bottom); padding-bottom: env(safe-area-inset-bottom); height: calc(54px + constant(safe-area-inset-bottom)); height: calc(54px + env(safe-area-inset-bottom)); background-color: var(--nav-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,.08); box-shadow: 0 -1px 14px rgba(0,0,0,.5); z-index: 99; overflow: hidden; }
        .tabs-container { display: flex; height: 54px; overflow: hidden; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: var(--text-sub); cursor: pointer; padding-top: 5px; outline: none; -webkit-tap-highlight-color: transparent; position: relative; }
        .tab-icon { width: 24px; height: 24px; margin-bottom: 2px; transition: transform .2s; display: flex; align-items: center; justify-content: center; }
        .tab-icon svg { width: 23px; height: 23px; }
        .tab-item.active { color: var(--primary); }
        .tab-item.active .tab-icon { transform: translateY(-1px) scale(1.08); }
        .tab-item .dot { position: absolute; top: 6px; right: 50%; margin-right: -22px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--primary); color: #fff; font-size: 10px; line-height: 16px; text-align: center; display: none; }
        .tab-item .dot.show { display: block; }
    </style>
</head>
<body>
<div class="content" id="iframeContainer">
    <div class="loading-overlay" id="loadingOverlay" style="display: none;"><div class="loader"></div></div>
</div>
<div class="footer" id="tabbar">
    <div class="tabs-container" id="tabsContainer"></div>
</div>
<!-- 导航控制器代码生成器（运行时用 srcdoc 动态生成并塞进 iframe） -->
<script src="./src/navTemplate.js"></script>
<script>
    // ========== tab 配置（菜单 + 导航控制器个性化参数） ==========
    const ICONS = {
        home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M8 21h8M12 19v2M7 12l5 3 5-3"/></svg>',
        category: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
        rank: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M7 4h10v3l-2 4v4H9v-4L7 7z"/><path d="M9 11h6"/></svg>',
        mine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
        guide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14h8M8 18h5"/></svg>'
    };
    const tabList = [
        { key: 'home',     icon: ICONS.home,     label: '直播',   rootTitle: '全球电视直播', rootPath: './pages/home.html' },
        { key: 'category', icon: ICONS.category, label: '分类',   rootTitle: '分类',   rootPath: './pages/category.html' },
        { key: 'rank',     icon: ICONS.rank,     label: '精选',   rootTitle: '精选',   rootPath: './pages/rank.html' },
        { key: 'guide',    icon: ICONS.guide,    label: '节目单', rootTitle: '节目单', rootPath: './pages/guide.html' },
        { key: 'mine',     icon: ICONS.mine,     label: '我的',   rootTitle: '我的',   rootPath: './pages/mine.html' }
    ];

    // 导航控制器共享主题（Live TV 暗色：红 + 金）
    const NAV_THEME = {
        primary:   '#ff2d55',
        navBg:     'rgba(10, 11, 16, 0.92)',
        border:    'rgba(255, 255, 255, 0.08)',
        titleColor:'#ffffff',
        pageBg:    '#0a0b10',
        font:      '-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif'
    };
    const APP_TITLE = '全球电视直播';
    const APP_BASE = new URL('./', location.href).href;

    const tabsContainer = document.getElementById('tabsContainer');
    function renderTabs() {
        tabsContainer.innerHTML = '';
        tabList.forEach((tab) => {
            const div = document.createElement('div');
            div.className = 'tab-item';
            div.dataset.key = tab.key;
            div.innerHTML = `<span class="tab-icon">${tab.icon}</span><span>${tab.label}</span><span class="dot" id="dot-${tab.key}"></span>`;
            tabsContainer.appendChild(div);
        });
    }

    const iframeContainer = document.getElementById('iframeContainer');
    const loadingOverlay = document.getElementById('loadingOverlay');
    let tabItems = [];
    const pageCache = {};
    const scrollPositions = {};
    let currentPageName = null;
    let domCheckTimer = null;

    function initTabs() {
        renderTabs();
        tabItems = document.querySelectorAll('.tab-item');
        tabItems.forEach(item => {
            item.addEventListener('click', () => {
                const key = item.dataset.key;
                if (key === currentPageName) return;
                saveScrollPosition(currentPageName);
                loadPage(key);
                updateNavStatus(key);
            });
        });
    }

    setTimeout(() => {
        initTabs();
        currentPageName = tabList[0].key;
        loadPage(tabList[0].key);
        updateNavStatus(currentPageName);
        try { window.addEventListener('appstore', refreshBadges); } catch (e) {}
        refreshBadges();
    }, 1);

    function checkPageHasContent(iframe) {
        try {
            if (!iframe.contentWindow || !iframe.contentDocument) return false;
            const d = iframe.contentDocument || iframe.contentWindow.document;
            const b = d.body; if (!b) return false;
            const cs = getComputedStyle(b);
            const bg = cs.backgroundColor;
            const hasBg = bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent';
            return hasBg || b.children.length > 0 || b.offsetHeight > 0 || (b.textContent && b.textContent.trim().length > 0);
        } catch (e) { return false; }
    }
    function hideLoadingAnimation() {
        if (domCheckTimer) { clearInterval(domCheckTimer); domCheckTimer = null; }
        loadingOverlay.style.display = 'none';
    }
    function monitorPageContent(iframe) {
        if (domCheckTimer) clearInterval(domCheckTimer);
        domCheckTimer = setInterval(() => { if (checkPageHasContent(iframe)) hideLoadingAnimation(); }, 50);
    }

    function loadPage(key) {
        loadingOverlay.style.display = 'flex';
        if (pageCache[key]) {
            if (currentPageName) {
                pageCache[currentPageName].classList.remove('active');
                if (pageCache[currentPageName].contentWindow.viewDidDisappear)
                    pageCache[currentPageName].contentWindow.viewDidDisappear({ pageName: currentPageName, to: key });
            }
            pageCache[key].classList.add('active');
            restoreScrollPosition(key);
            const iframe = pageCache[key];
            if (iframe.contentWindow.viewDidAppear)
                iframe.contentWindow.viewDidAppear({ pageName: key, frome: currentPageName });
            monitorPageContent(iframe);
            currentPageName = key;
            return;
        }
        const tabCfg = tabList.find(t => t.key === key);
        const iframe = document.createElement('iframe');
        iframe.className = 'page-iframe';
        iframe.dataset.key = key;
        iframe.src = 'about:blank';
        iframe.getBoundingClientRect();
        setTimeout(() => {
            iframe.srcdoc = NavFactory.buildNavController({
                rootTitle: tabCfg.rootTitle,
                rootPath: tabCfg.rootPath,
                theme: NAV_THEME,
                base: APP_BASE,
                docTitle: APP_TITLE
            });
            monitorPageContent(iframe);
            iframe.onload = function () { return; };
            iframe.onerror = () => hideLoadingAnimation();
        }, 10);
        iframeContainer.appendChild(iframe);
        pageCache[key] = iframe;
        if (currentPageName && pageCache[currentPageName]) {
            pageCache[currentPageName].classList.remove('active');
            if (pageCache[currentPageName].contentWindow.viewDidDisappear)
                pageCache[currentPageName].contentWindow.viewDidDisappear({ pageName: currentPageName, to: key });
        }
        iframe.classList.add('active');
        currentPageName = key;
    }
    function saveScrollPosition(pageName) {
        if (!pageName || !pageCache[pageName]) return;
        const iframe = pageCache[pageName];
        if (iframe.contentWindow) scrollPositions[pageName] = iframe.contentWindow.scrollY;
    }
    function restoreScrollPosition(pageName) {
        if (!pageName || !pageCache[pageName] || scrollPositions[pageName] === undefined) return;
        const iframe = pageCache[pageName];
        setTimeout(() => { if (iframe.contentWindow) iframe.contentWindow.scrollTo(0, scrollPositions[pageName]); }, 0);
    }
    function updateNavStatus(activePage) {
        tabItems.forEach(item => { item.classList.toggle('active', item.dataset.key === activePage); });
    }
    function refreshBadges() {
        try {
            const raw = localStorage.getItem('tv_favs');
            const n = raw ? (JSON.parse(raw).length || 0) : 0;
            const dot = document.getElementById('dot-mine');
            if (dot) { dot.textContent = n > 99 ? '99+' : n; dot.classList.toggle('show', n > 0); }
        } catch (e) {}
    }
    function setTabBarHidden(hidden) {
        const tabBar = document.getElementById('tabbar');
        tabBar.style.zIndex = hidden ? -99 : 99;
    }
    function receiveNativeMessage(body) {
        if (pageCache[currentPageName].contentWindow.receiveNativeMessage) {
            pageCache[currentPageName].contentWindow.receiveNativeMessage(body);
        }
    }
</script>
</body>
</html>

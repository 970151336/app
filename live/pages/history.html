<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>观看历史</title>
  <link rel="stylesheet" href="./page.css?v=8">
  <script src="../src/MpPageRouter.js"></script>
  <script src="./data.js?v=8"></script>
  <script src="./store.js?v=8"></script>
</head>
<body>
  <main class="page-body" id="body"><div class="empty"><i>⏳</i> 加载中…</div></main>
</body>
<script>
  function openChannel(id) { MpNavigateTo('./pages/channel.html', '频道', { c: id }); }
  function render() {
    const list = window.AppStore.getHistory();
    if (!list.length) {
      document.getElementById('body').innerHTML = `<div class="empty"><i>🕑</i><div>还没有观看记录</div>
        <div style="font-size:12px;color:var(--text-sub);margin-top:6px">播放过的频道会出现在这里</div></div>`;
      return;
    }
    document.getElementById('body').innerHTML =
      `<div class="section" style="margin-top:2px"><div class="section-title"><span class="bar"></span>观看历史</div>
        <div class="section-more">${list.length} 条</div></div>
       <div class="ch-grid">${list.map(d => window.MpUI.channelCard(d)).join('')}</div><div style="height:10px"></div>`;
    window.MpUI.lazyScan();
  }
  function clearAll() { window.AppStore.clearHistory(); render(); }
  MpPageLifeCycle.init({
    onLoad: () => { MpSetNavRightBar('<div style="font-size:14px" onclick="clearAll()">清空</div>'); render(); },
    onShow: () => { render(); }, onHide: () => {}, onDestroy: () => {}
  });
</script>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>节目单</title>
  <link rel="stylesheet" href="./page.css?v=8">
  <script src="../src/MpPageRouter.js"></script>
  <script src="./data.js?v=8"></script>
  <script src="./api.js?v=8"></script>
  <script src="./store.js?v=8"></script>
</head>
<body>
  <main class="page-body" id="body">
    <div class="search-box">
      <input id="q" type="search" placeholder="筛选频道 / EPG 站点" onkeydown="if(event.key==='Enter')doFilter()">
      <div class="go" onclick="doFilter()">筛选</div>
    </div>
    <div class="hero-text">节目单(EPG)来自 iptv-org 的 <b>guides.json</b> 实时接口，按提供方站点分组。点击「源」可在新窗口打开该站的 XMLTV 节目数据，点击频道可跳转到对应直播频道。</div>
    <div id="status" class="offline-bar" style="display:none"></div>
    <div id="list">
      <div class="empty" style="padding:26px 0">
        <i>📋</i>
        <div style="margin-top:12px;font-size:13px;line-height:1.7;color:var(--text-sub)">节目单数据较大（约 <b style="color:var(--gold)">25 MB</b>），<br>首次加载需要一点时间，完成后会自动缓存，下次秒开。</div>
      </div>
    </div>
    <div id="prog" class="progress" style="display:none">
      <div class="p-label"><span id="prog-txt">正在下载节目单…</span><span id="prog-pct">0%</span></div>
      <div class="p-track"><div class="p-fill" id="prog-fill"></div></div>
    </div>
    <div style="height:14px"></div>
  </main>
</body>
<script>
  const esc = window.MpUI.esc;
  let _groups = [];
  let _loading = false;
  let _updated = 0;
  const listEl = () => document.getElementById('list');
  const MAX_PER_GROUP = 30;

  function openChannel(id) { MpNavigateTo('./pages/channel.html', '频道', { c: id }); }

  function groupBySite(guides) {
    const g = {};
    guides.forEach(x => { (g[x.site] = g[x.site] || []).push(x); });
    return Object.keys(g).map(site => ({
      site: site,
      name: (g[site].find(x => x.site_name) || {}).site_name || site,
      items: g[site]
    }));
  }

  // guides.json 真实字段：channel / site / site_name / lang / url / feed
  // （兼容旧的 x.sources[0].url 形态，但优先用顶层 url）
  function srcOf(x) {
    if (x.url) return x.url;
    if (x.sources && x.sources[0]) return x.sources[0].url || x.sources[0];
    return null;
  }

  function render(groups) {
    if (!groups.length) { listEl().innerHTML = '<div class="empty"><i>📋</i>暂无节目单数据</div>'; return; }
    listEl().innerHTML = groups.map(gp => {
      const items = gp.items.slice(0, MAX_PER_GROUP).map(x => {
        const src = srcOf(x);
        const sub = [x.lang, (x.feed ? ('feed ' + x.feed) : '')].filter(Boolean).join(' · ');
        const ch = x.channel || '';
        const label = src ? (src.split('/').pop() || 'XMLTV') : '';
        return `<div class="guide-item" onclick="openChannel('${esc(ch)}')">
          <div class="gi-main"><div class="gi-name">${esc(ch)}</div>
            <div class="gi-sub">${esc(sub)}${src ? ' · ' + esc(label) : ''}</div></div>
          <div class="gi-act" onclick="event.stopPropagation();${src ? "window.open('" + esc(src) + "','_blank')" : ''}">${src ? '源 ↗' : '—'}</div>
        </div>`;
      }).join('');
      const more = gp.items.length > MAX_PER_GROUP ? `<div class="gi-sub" style="padding:8px 14px;color:var(--text-sub)">…还有 ${gp.items.length - MAX_PER_GROUP} 个频道</div>` : '';
      return `<div class="guide-group"><div class="gg-title">${esc(gp.name)} <span class="badge">${gp.items.length} 个频道</span></div>
        <div class="card">${items}${more}</div></div>`;
    }).join('');
  }

  function setStatus(txt, kind) {
    const el = document.getElementById('status');
    if (!txt) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    if (kind === 'err') { el.style.background = 'rgba(255,80,80,.14)'; el.style.color = '#ff9a9a'; el.style.borderColor = 'rgba(255,80,80,.3)'; }
    else if (kind === 'ok') { el.style.background = 'rgba(255,210,74,.12)'; el.style.color = 'var(--gold)'; el.style.borderColor = 'rgba(255,210,74,.3)'; }
    else { el.style.background = 'rgba(255,255,255,.06)'; el.style.color = 'var(--text-sub)'; el.style.borderColor = 'var(--border)'; }
    el.innerHTML = txt;
  }

  function showProgress(received, total) {
    const prog = document.getElementById('prog');
    prog.style.display = 'block';
    const pct = total ? Math.min(100, Math.round(received / total * 100)) : 0;
    document.getElementById('prog-fill').style.width = pct + '%';
    document.getElementById('prog-pct').textContent = pct + '%';
    const mb = (received / 1048576).toFixed(1);
    const totMb = total ? (total / 1048576).toFixed(1) : '';
    document.getElementById('prog-txt').textContent = total ? ('正在下载节目单 ' + mb + ' / ' + totMb + ' MB') : ('正在下载节目单 ' + mb + ' MB');
    setStatus('⏳ 节目单数据较大(约 25MB)，首次加载稍慢，完成后自动缓存', 'loading');
  }
  function hideProgress() { document.getElementById('prog').style.display = 'none'; }

  function showUpdated() {
    if (!_updated) return;
    const total = _groups.reduce((n, g) => n + g.items.length, 0);
    setStatus('✅ 已更新 ' + new Date(_updated).toLocaleTimeString() + ' · 共 ' + total + ' 条 EPG 源', 'ok');
    setTimeout(() => { if (!window.TVAPI.isOffline()) setStatus('', 'ok'); }, 3500);
  }

  async function load() {
    if (_loading) return;
    _loading = true;
    // 已在内存缓存(同会话内)则直接秒渲染
    if (!_groups.length) showProgress(0, 0);
    try {
      const guides = await window.TVAPI.getGuides(function (received, total) {
        showProgress(received, total);
      });
      _groups = groupBySite(guides);
      render(_groups);
      _updated = Date.now();
      hideProgress();
      if (!_groups.length) setStatus('暂无节目单数据', 'ok');
      else showUpdated();
    } catch (e) {
      hideProgress();
      if (!_groups.length) {
        listEl().innerHTML = '<div class="empty"><i>📋</i>节目单加载失败<div style="margin-top:12px"><button class="btn-fav" style="border:0" onclick="load()">点击重试</button></div></div>';
      }
      setStatus('⚠️ 节目单加载失败，请检查网络后重试', 'err');
    } finally {
      _loading = false;
    }
  }

  function doFilter() {
    const q = (document.getElementById('q').value || '').trim().toLowerCase();
    if (!q) { render(_groups); return; }
    const f = _groups.map(gp => ({
      site: gp.site, name: gp.name,
      items: gp.items.filter(x => (x.channel || '').toLowerCase().indexOf(q) >= 0 || (x.site || '').toLowerCase().indexOf(q) >= 0 || (x.site_name || '').toLowerCase().indexOf(q) >= 0)
    })).filter(gp => gp.items.length);
    render(f);
    setStatus(q ? '筛选「' + q + '」命中 ' + f.reduce((n, g) => n + g.items.length, 0) + ' 条' : '', 'ok');
  }

  // 切回本 Tab / 页面重新可见时自动刷新（壳层仅 CSS 显隐 iframe，
  // MpPageRouter 不会在 Tab 切换时重发 onShow，故用 visibilitychange 兜底）
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
  // 兼容壳层可能转发的 viewDidAppear（外层 iframe 的 contentWindow，本页挂在自身 window 上作为兜底）
  window.viewDidAppear = function () { load(); };

  function setupTopBar() {
    try { MpSetNavRightBar('<div class="nav-btn" onclick="load()">刷新</div>'); } catch (e) {}
  }
  setTimeout(setupTopBar, 300);

  window.doFilter = doFilter;
  window.load = load;

  // 注册框架生命周期：进入页面(onLoad)即拉取节目单
  MpPageLifeCycle.init({
    onLoad: () => { load(); },
    onShow: () => { load(); },
    onHide: () => {}, onDestroy: () => {}
  });
  // 防御性兜底：若 onLoad 因时序未触发，脚本执行末尾也主动拉一次（_loading 锁保证不会重复请求）
  setTimeout(load, 50);
</script>
</html>

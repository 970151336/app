<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>全部分类</title>
  <link rel="stylesheet" href="./page.css">
  <script src="../src/MpPageRouter.js"></script>
  <script src="./data.js"></script>
  <script src="./api.js"></script>
  <script src="./store.js"></script>
</head>
<body>
  <main class="page-body" id="body">
    <div id="offbar"></div>
    <div class="section" style="margin-top:2px"><div class="section-title"><span class="bar"></span>全部分类</div>
      <div class="section-more">实时 · iptv-org</div></div>
    <div class="cat-grid" id="grid"><div class="empty" style="padding:30px 0">加载分类…</div></div>
    <div style="height:14px"></div>
  </main>
</body>
<script>
  const esc = window.MpUI.esc;
  const ICO = { news: '📰', sports: '⚽', general: '📺', movies: '🎬', music: '🎵', documentary: '🎥', kids: '🧸', entertainment: '🎭', business: '💹', education: '📚', religion: '⛪', gaming: '🎮', travel: '✈️', weather: '🌤️', politics: '🏛️', technology: '💡', culture: '🎨', food: '🍜', auto: '🚗', shop: '🛍️', others: '📺' };
  function goChannelList(id, name) { MpNavigateTo('./pages/channels.html', name, { type: 'category', value: id, label: name }); }
  async function render() {
    if (window.TVAPI.isOffline()) document.getElementById('offbar').innerHTML = '<div class="offline-bar">⚠️ 实时接口暂不可用，分类基于本地缓存</div>';
    try {
      const cats = await window.TVAPI.allCategories();
      if (!cats.length) { document.getElementById('grid').innerHTML = '<div class="empty">暂无分类数据</div>'; return; }
      document.getElementById('grid').innerHTML = cats.map(c =>
        `<div class="cat-card" onclick="goChannelList('${esc(c.id)}','${esc(c.name)}')">
          <div class="cc-ico">${ICO[c.id] || '📺'}</div>
          <div class="cc-name">${esc(c.name)}</div>
          <div class="cc-desc">${esc(c.desc || '')}</div>
          <div class="cc-count">${c.count || 0} 台</div>
        </div>`).join('');
    } catch (e) {
      document.getElementById('grid').innerHTML = '<div class="empty">分类加载失败</div>';
    }
  }
  MpPageLifeCycle.init({
    onLoad: () => { render(); },
    onShow: () => {}, onHide: () => {}, onDestroy: () => {}
  });
</script>
</html>
